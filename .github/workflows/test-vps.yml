name: Verificar conexão VPS
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/test-vps.yml"

permissions:
  contents: read

jobs:
  check-vps:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verificar configuração dos secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST_FINGERPRINT: ${{ secrets.VPS_HOST_FINGERPRINT }}
        run: |
          set -eu
          for var in VPS_HOST VPS_PORT VPS_USER VPS_SSH_KEY VPS_KNOWN_HOSTS VPS_HOST_FINGERPRINT; do
            [ -n "${!var}" ] || { echo "::error::Secret ausente: $var"; exit 1; }
          done
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null || { echo "::error::Chave privada SSH inválida"; exit 1; }
          actual="$(ssh-keygen -lf ~/.ssh/known_hosts -E sha256 | awk 'NR==1 {print $2}')"
          [ "$actual" = "$VPS_HOST_FINGERPRINT" ] || { echo "::error::Fingerprint SSH diferente do configurado"; exit 1; }
          ssh-keygen -F "$VPS_HOST" -f ~/.ssh/known_hosts >/dev/null || { echo "::error::VPS_HOST não consta em known_hosts"; exit 1; }
          echo "Secrets e identidade SSH localmente validados"
      - name: Testar acesso externo SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 "$VPS_USER@$VPS_HOST" 'echo "SSH_REMOTE_OK"; whoami; test -d "$HOME"'
