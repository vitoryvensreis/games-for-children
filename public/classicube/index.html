<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<meta name="theme-color" content="#13213d">
<title>ClassiCube — GamesForChildren</title>
<style>
*,*:before,*:after{box-sizing:border-box}
html,body{position:fixed;inset:0;margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#071122;color:#fff;font-family:system-ui,-apple-system,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
#canvas{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:fill;border:0;padding:0;margin:0;background:#050b19;touch-action:none;-webkit-tap-highlight-color:transparent}
#canvas_wrapper{position:fixed!important;inset:0!important;width:100%!important;height:100%!important;overflow:hidden!important}
#canvas_wrapper #canvas{position:absolute;inset:0;width:100%;height:100%}
#logmsg{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;transform:translateX(-50%);max-width:76vw;padding:8px 12px;font-size:12px;text-align:center;background:#111b3cdd;border:1px solid #ffffff44;border-radius:11px;color:white;pointer-events:none;z-index:5}
#error{position:fixed;inset:0;display:none;justify-content:center;align-items:center;z-index:10;padding:22px;text-align:center;background:#151a46}
#error a{color:#ffe27e}


/* Controle de videogame analógico: uma única superfície de toque por joystick. */
#familyPad[hidden]{display:none!important}
#familyPad{
 position:fixed;inset:0;z-index:15;pointer-events:none;touch-action:none;
 font-family:system-ui,-apple-system,sans-serif;
 --pad-size:clamp(122px,34dvh,184px);
}
.family-pad-panel{
 position:absolute;width:var(--pad-size);height:var(--pad-size);
 aspect-ratio:1;border-radius:50%;touch-action:none;
 background:radial-gradient(circle at 35% 22%,#4a5366 0,#272e3c 55%,#151b2b 100%);
 border:3px solid #7c899c;
 box-shadow:inset 0 5px 8px #ffffff22,inset 0 -7px 15px #050b19a8,0 8px 18px #071020bd;
}
.family-pad-left{
 left:env(safe-area-inset-left,0px);
 bottom:calc(env(safe-area-inset-bottom,0px) + 2vh);
 pointer-events:auto;overflow:hidden;
}
.joystick-surface{
 width:100%;height:100%;border-radius:50%;
 display:flex;align-items:center;justify-content:center;
 position:relative;touch-action:none;user-select:none;-webkit-user-select:none;
 -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
 cursor:grab;outline:none;
}
.joystick-surface:before{
 content:"";position:absolute;inset:9%;border-radius:50%;
 background:radial-gradient(circle at 50% 45%,#0e172c 0%,#26374f 59%,#0c1525 100%);
 border:2px solid #778daa88;
 box-shadow:inset 0 7px 15px #070d1bbd,0 2px 3px #a5b9da3a;
}
.joystick-mark{
 position:absolute;z-index:1;color:#d4e5f6a6;
 font:900 clamp(12px,2.7dvh,19px)/1 system-ui,sans-serif;
 pointer-events:none;text-shadow:0 2px 2px #050d23aa;
}
.joystick-mark.top{top:7%}
.joystick-mark.bottom{bottom:7%}
.joystick-mark.left{left:7%}
.joystick-mark.right{right:7%}
.joystick-thumb{
 position:absolute;z-index:3;width:43%;height:43%;border-radius:50%;
 background:radial-gradient(circle at 33% 24%,#a6c3e1 0%,#5881aa 28%,#254564 72%,#152943 100%);
 border:3px solid #a4bfd6;
 box-shadow:inset 0 5px 8px #ffffff6e,inset 0 -10px 12px #07142b99,0 8px 10px #030c1bc7;
 transform:translate3d(0,0,0);pointer-events:none;
 transition:transform .1s ease-out;will-change:transform;
}
.joystick-surface.is-dragging .joystick-thumb{transition:none}
.joystick-thumb:after{
 content:"";position:absolute;inset:16%;border-radius:50%;
 border:1px solid #c4e4ff44;
 background:radial-gradient(circle at 33% 23%,#ffffff35,transparent 65%);
}
.family-pad-right{
 right:env(safe-area-inset-right,0px);
 bottom:calc(env(safe-area-inset-bottom,0px) + 2vh);
 pointer-events:none;
 display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
 grid-template-rows:repeat(2,minmax(0,1fr));
 gap:clamp(5px,1.6dvh,10px);padding:clamp(12px,3dvh,19px);
}
.family-pad-right button{
 pointer-events:auto;touch-action:none;
 user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
 -webkit-tap-highlight-color:transparent;
 width:100%;height:100%;min-width:0;min-height:0;
 padding:4px;border-radius:50%;border:2px solid #fff9;
 display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
 color:#fff;font:900 clamp(9px,2.25dvh,14px)/1.12 system-ui,sans-serif;
 text-align:center;text-shadow:0 1px 3px #10182a;
 box-shadow:inset 0 4px 5px #ffffff42,inset 0 -6px 8px #10173566,0 4px 0 #121b32,0 6px 12px #050d1d8a;
}
.family-pad-right button.is-pressed{
 transform:translateY(2px) scale(.96);
 filter:brightness(1.12);
 box-shadow:inset 0 3px 8px #0a1d3a77,0 1px 0 #101627;
}
.family-pad-right .jump{grid-column:2;grid-row:1;background:linear-gradient(160deg,#82acff,#365dc2)}
.family-pad-right .place{grid-column:1;grid-row:2;background:linear-gradient(160deg,#48dab6,#11735f)}
.family-pad-right .break{grid-column:2;grid-row:2;background:linear-gradient(160deg,#ff929b,#b43b53)}
.family-pad-right .action-symbol{font-size:clamp(13px,3.8dvh,23px);line-height:1}
.family-pad-right .action-label{font-size:clamp(8px,2.1dvh,11px);letter-spacing:.15px}
@media(pointer:fine){#familyPad{display:none!important}}
@media(max-height:410px){
 #familyPad{--pad-size:clamp(114px,33dvh,164px)}
 .family-pad-left,.family-pad-right{bottom:calc(env(safe-area-inset-bottom,0px) + 1vh)}
 .family-pad-right{padding:10px;gap:5px}
 .family-pad-right button{border-width:1.5px}
}
@media(max-width:650px) and (orientation:landscape){
 #familyPad{--pad-size:clamp(112px,33dvh,158px)}
 .family-pad-left{left:env(safe-area-inset-left,0px)}
 .family-pad-right{right:env(safe-area-inset-right,0px)}
}


/* Menu seguro do multiplayer; os controles do joystick continuam intocados */
#familyMenuBtn{position:fixed;left:calc(env(safe-area-inset-left,0px) + 112px);top:calc(env(safe-area-inset-top,0px) + 8px);z-index:35;padding:8px 13px;border-radius:12px;border:1px solid #d5efff8c;background:#223d77ed;color:#fff;font:900 12px system-ui,sans-serif;min-height:39px;touch-action:manipulation}
#familyMenuBtn[hidden],#familyPanel[hidden]{display:none!important}
#familyPanel{position:fixed;z-index:41;top:calc(env(safe-area-inset-top,0px) + 54px);left:calc(env(safe-area-inset-left,0px) + 8px);width:min(410px,calc(100vw - 16px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px)));max-height:calc(100dvh - 68px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow-y:auto;overscroll-behavior:contain;background:#152747f5;color:#fff;border:2px solid #9bc9fa;border-radius:17px;padding:14px;box-shadow:0 14px 34px #0008;touch-action:pan-y;font:600 13px system-ui,sans-serif}
#familyPanel header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
#familyPanel header strong{font-size:16px}
#familyPanel .family-close{width:36px;height:36px;border:0;border-radius:50%;background:#405d99;color:#fff;font-size:20px}
#familyPanel .family-section{margin:12px 0 0;border-top:1px solid #a8bfe45e;padding-top:11px}
#familyPanel .family-section h3{margin:0 0 8px;font-size:13px;color:#f7e79d}
#familyPanel .family-row{display:flex;flex-wrap:wrap;gap:7px}
#familyPanel button.family-action{font-size:12px;padding:10px 11px;color:#fff;background:#3c64b5;border:1px solid #7197e8;border-radius:10px;min-height:41px;touch-action:manipulation;box-shadow:none}
#familyPanel button.family-action:disabled{opacity:.5}
#familyPanel .family-action.family-primary{background:#148c71;border-color:#75e7cc}
#familyPanel .family-hint{font-size:11px;color:#d5e5fa;line-height:1.4;margin:6px 0 0}
#familyPanel #familyMessage{font-size:12px;color:#ffe1a9;min-height:15px;margin-top:8px}
#mcVitals{position:fixed;left:calc(env(safe-area-inset-left,0px) + 9px);top:calc(env(safe-area-inset-top,0px) + 53px);z-index:18;display:grid;gap:2px;pointer-events:none;color:#fff;padding:7px 9px;border-radius:12px;background:#13233acb;border:1px solid #ffffff60;backdrop-filter:blur(3px);font-family:system-ui,sans-serif;font-weight:900}
.mc-vitals-icons{display:flex;gap:1px;height:16px}
.mc-vitals-icons svg{width:17px;height:16px;flex:0 0 17px}
.mc-climate{font-size:11px;color:#eaf0ff;line-height:1.2;white-space:nowrap}
@media(max-height:450px){#mcVitals{transform:scale(.85);transform-origin:top left}}
#desktopControlsHint[hidden]{display:none!important}
#desktopControlsHint{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:17;border:1px solid #b5ddff90;background:#10264be9;color:white;border-radius:12px;padding:8px 14px;pointer-events:none;white-space:nowrap;font:bold 13px system-ui,sans-serif}
@media(pointer:coarse){#desktopControlsHint{display:none!important}}



/* Personalize touch visibility without exposing original buttons behind the opaque base. */
#familyPad .family-pad-right button,#familyPad .joystick-thumb{opacity:var(--mc-pad-opacity,1)}
</style>
</head><body><canvas id="canvas" tabindex="0" aria-label="Jogo Minecraft: use W A S D para andar, Espaço para pular e o mouse para olhar" oncontextmenu="event.preventDefault()"></canvas><div id="desktopControlsHint" hidden>Andar: W A S D &nbsp; | &nbsp; Pular: Espaço &nbsp; | &nbsp; Mouse: olhar</div><div id="logmsg">Carregando ClassiCube do nosso servidor...</div><div id="error"><p>Não foi possível iniciar o jogo 3D. Verifique a conexão e tente abrir novamente.</p></div><div id="familyPad" role="group" aria-label="Controles para jogar no celular" hidden>
  <div class="family-pad-panel family-pad-left" aria-label="Joystick analógico para movimentar">
    <div id="familyJoystick" class="joystick-surface" role="group" aria-label="Mova o polegar para andar em qualquer direção">
      <span class="joystick-mark top" aria-hidden="true">▲</span>
      <span class="joystick-mark left" aria-hidden="true">◀</span>
      <span class="joystick-mark right" aria-hidden="true">▶</span>
      <span class="joystick-mark bottom" aria-hidden="true">▼</span>
      <div id="familyStick" class="joystick-thumb" aria-hidden="true"></div>
    </div>
  </div>
  <div class="family-pad-panel family-pad-right" aria-label="Ações do jogo">
    <button type="button" data-key="Space" class="jump" aria-label="Pular"><span class="action-symbol" aria-hidden="true">↑</span><span class="action-label">PULAR</span></button>
    <button type="button" data-mouse="2" class="place" aria-label="Colocar bloco"><span class="action-symbol" aria-hidden="true">＋</span><span class="action-label">COLOCAR</span></button>
    <button type="button" data-mouse="0" class="break" aria-label="Quebrar bloco"><span class="action-symbol" aria-hidden="true">−</span><span class="action-label">QUEBRAR</span></button>
  </div>
</div>
<script>
(async()=>{
const status=document.getElementById('logmsg'), canvas=document.getElementById('canvas'), error=document.getElementById('error');
  // The upstream ClassiCube webclient expects this callback on viewport changes.
  // Match the WebGL framebuffer to the *visible* iframe bounds; do not crop or stretch.
  window.resizeGameCanvas=function(){
    const viewport=window.visualViewport;
    const width=Math.max(1,Math.round(viewport?.width||document.documentElement.clientWidth||window.innerWidth));
    const height=Math.max(1,Math.round(viewport?.height||document.documentElement.clientHeight||window.innerHeight));
    const pixelRatio=window.devicePixelRatio||1;
    const pixelsWide=Math.max(1,Math.round(width*pixelRatio));
    const pixelsHigh=Math.max(1,Math.round(height*pixelRatio));
    if(canvas.width!==pixelsWide)canvas.width=pixelsWide;
    if(canvas.height!==pixelsHigh)canvas.height=pixelsHigh;
    canvas.style.width=width+'px';
    canvas.style.height=height+'px';
  };
  window.forceTouchLayout=window.resizeGameCanvas;
  window.resizeGameCanvas();
  window.visualViewport?.addEventListener('resize',window.resizeGameCanvas);

try{
 const response=await fetch('/api/me',{credentials:'same-origin'});
 if(!response.ok)throw Error('É necessário entrar no GamesForChildren.');
 const user=(await response.json()).user;
 const responseWorld=await fetch('/api/classicube/status',{credentials:'same-origin'});
 if(!responseWorld.ok)throw Error('Mundo da família não disponível');
 const config=await responseWorld.json();
 const username=config.playerName||'Jogador';
 if(!config.multiplayerConfigured){throw Error('O mundo compartilhado ainda está iniciando. Aguarde alguns segundos e tente novamente.')}
 // Desktop: parent launcher and menu buttons can leave keyboard focus outside WebGL.
 // Explicitly return focus to the canvas so native keydown/keyup events reach ClassiCube.
 if(!window.matchMedia('(pointer:coarse)').matches){
  const hint=document.getElementById('desktopControlsHint');
  hint.hidden=false;
  const focusCanvas=()=>{if(document.getElementById('familyPanel')?.hidden!==false)canvas.focus({preventScroll:true})};
  canvas.addEventListener('pointerdown',focusCanvas);
  window.addEventListener('focus',()=>requestAnimationFrame(focusCanvas));
  document.addEventListener('keydown',event=>{
   if(['KeyW','KeyA','KeyS','KeyD','Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(event.code)){
    hint.hidden=true;
    if(document.activeElement!==canvas&&document.getElementById('familyPanel')?.hidden!==false)focusCanvas();
   }
  },true);
  setTimeout(()=>{hint.hidden=true},12000);
  requestAnimationFrame(focusCanvas);
 }
 // The Emscripten ClassiCube webclient always connects using its own WebSocket.
 // Redirect only the ClassiCube protocol to our cookie-authenticated, same-origin gateway.
 const NativeWebSocket=window.WebSocket;
 function FamilyWebSocket(url,protocols){
  if(protocols==='ClassiCube'){const socket=new NativeWebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws?classicube=1','ClassiCube');window.familyGameSocket=socket;return socket;}
  return new NativeWebSocket(url,protocols);
 }
 FamilyWebSocket.prototype=NativeWebSocket.prototype;
 Object.setPrototypeOf(FamilyWebSocket,NativeWebSocket);
 window.WebSocket=FamilyWebSocket;
 window.Module={
 preRun:[],postRun:[()=>{if(!window.matchMedia('(pointer:coarse)').matches){requestAnimationFrame(()=>canvas.focus({preventScroll:true}));}}],arguments:[username,'',location.hostname,'443'],canvas,print:(...args)=>console.log(...args),printErr:(...args)=>console.warn(...args),
 setStatus:text=>{status.textContent=text;if(!text||text==='All downloads complete.')setTimeout(()=>status.style.display='none',1200)},
 totalDependencies:0,
 monitorRunDependencies(left){this.totalDependencies=Math.max(this.totalDependencies,left);this.setStatus(left?'Preparando arquivos... '+(this.totalDependencies-left)+'/'+this.totalDependencies:'All downloads complete.')}
 };
 const script=document.createElement('script');script.src='/classicube/ClassiCube.js';script.async=true;script.onerror=()=>{status.style.display='none';error.style.display='flex';error.firstElementChild.textContent='Arquivos do ClassiCube não encontrados na nossa VPS.'};document.body.append(script);
}catch(e){status.style.display='none';error.style.display='flex';error.firstElementChild.textContent=e.message}
})();
</script>
<script>
/* Joystick analógico independente, com liberação garantida de teclas e ações. */
(function(){
 const layer=document.getElementById('familyPad');
 const canvas=document.getElementById('canvas');
 const joystick=document.getElementById('familyJoystick');
 const thumb=document.getElementById('familyStick');
 if(!layer||!window.matchMedia('(pointer:coarse)').matches)return;
 layer.hidden=false;
 const active=new Map();
 const movement=new Set();
 let stickPointer=null;
 const NEUTRAL=0.32;
 function keyEvent(type,code){
  const isSpace=code==='Space',num=isSpace?32:code.charCodeAt(3);
  const ev=new KeyboardEvent(type,{key:isSpace?' ':code[3].toLowerCase(),code,bubbles:true,cancelable:true});
  Object.defineProperty(ev,'keyCode',{get:()=>num});
  Object.defineProperty(ev,'which',{get:()=>num});
  window.dispatchEvent(ev);
 }
 function mouseEvent(type,button){
  const rect=canvas.getBoundingClientRect();
  const ev=new MouseEvent(type,{
   button,buttons:type==='mousedown'?(button===2?2:1):0,
   clientX:rect.left+rect.width/2,clientY:rect.top+rect.height/2,
   bubbles:true,cancelable:true,view:window
  });
  canvas.dispatchEvent(ev);
 }
 function updateMovement(next){
  for(const key of [...movement])if(!next.has(key)){movement.delete(key);keyEvent('keyup',key)}
  for(const key of next)if(!movement.has(key)){movement.add(key);keyEvent('keydown',key)}
 }
 function updateStick(clientX,clientY){
  const rect=joystick.getBoundingClientRect();
  const centerX=rect.left+rect.width/2,centerY=rect.top+rect.height/2;
  const maxRadius=rect.width*.27;
  const rawX=clientX-centerX,rawY=clientY-centerY;
  const length=Math.hypot(rawX,rawY);
  const scale=length>maxRadius?maxRadius/length:1;
  const x=rawX*scale,y=rawY*scale;
  thumb.style.transform='translate3d('+x.toFixed(1)+'px,'+y.toFixed(1)+'px,0)';
  const nx=x/maxRadius,ny=y/maxRadius;
  const keys=new Set();
  if(ny < -NEUTRAL)keys.add('KeyW');
  if(ny > NEUTRAL)keys.add('KeyS');
  if(nx < -NEUTRAL)keys.add('KeyA');
  if(nx > NEUTRAL)keys.add('KeyD');
  updateMovement(keys);
 }
 function releaseStick(){
  if(stickPointer===null)return;
  stickPointer=null;
  joystick.classList.remove('is-dragging');
  thumb.style.transform='translate3d(0,0,0)';
  updateMovement(new Set());
 }
 joystick.addEventListener('pointerdown',event=>{
  event.preventDefault();event.stopPropagation();
  if(stickPointer!==null)return;
  stickPointer=event.pointerId;
  joystick.classList.add('is-dragging');
  try{joystick.setPointerCapture(event.pointerId)}catch{}
  updateStick(event.clientX,event.clientY);
 },{passive:false});
 joystick.addEventListener('pointermove',event=>{
  if(stickPointer!==event.pointerId)return;
  event.preventDefault();event.stopPropagation();
  updateStick(event.clientX,event.clientY);
 },{passive:false});
 for(const name of ['pointerup','pointercancel','lostpointercapture']){
  joystick.addEventListener(name,event=>{
   if(stickPointer!==event.pointerId)return;
   event.preventDefault();event.stopPropagation();
   releaseStick();
  },{passive:false});
 }
 function release(button){
  const previous=active.get(button);if(!previous)return;
  active.delete(button);button.classList.remove('is-pressed');
  if(previous.key)keyEvent('keyup',previous.key);
  else mouseEvent('mouseup',previous.mouse);
 }
 for(const button of layer.querySelectorAll('.family-pad-right button')){
  button.addEventListener('pointerdown',event=>{
   event.preventDefault();event.stopPropagation();
   if(active.has(button))return;
   try{button.setPointerCapture(event.pointerId)}catch{}
   const key=button.dataset.key,mouse=button.dataset.mouse;
   if(key){active.set(button,{key});keyEvent('keydown',key)}
   else if(mouse!==undefined){active.set(button,{mouse:Number(mouse)});mouseEvent('mousedown',Number(mouse))}
   button.classList.add('is-pressed');
  },{passive:false});
  for(const name of ['pointerup','pointercancel','lostpointercapture'])button.addEventListener(name,event=>{
   event.preventDefault();event.stopPropagation();release(button);
  },{passive:false});
  button.addEventListener('contextmenu',event=>event.preventDefault());
 }
 for(const name of ['touchstart','touchmove','touchend','touchcancel'])layer.addEventListener(name,event=>{
  event.preventDefault();event.stopPropagation();
 },{passive:false});
 const releaseAll=()=>{
  releaseStick();
  for(const b of [...active.keys()])release(b);
 };
 window.addEventListener('blur',releaseAll);
 document.addEventListener('visibilitychange',()=>{if(document.hidden)releaseAll()});
 window.addEventListener('pagehide',releaseAll);
})();
</script>

<script>
(async function(){
 if(!window.matchMedia('(pointer:coarse)').matches)return;
 try{
  const response=await fetch('/api/minecraft/controls',{credentials:'same-origin',cache:'no-store'});
  if(!response.ok)return;
  const data=await response.json();
  const p=data.controls||{},pad=document.getElementById('familyPad');
  if(!pad)return;
  const size=Math.max(100,Math.min(220,Number(p.padSize)||152));
  const opacity=Math.max(45,Math.min(100,Number(p.padOpacity)||85));
  pad.style.setProperty('--pad-size',size+'px');
  pad.style.setProperty('--mc-pad-opacity',String(opacity/100));
 }catch(e){console.warn('Controles personalizados indisponíveis',e)}
})();
</script>
