name: Deploy GamesForChildren
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-gamesforchildren
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: node --check server.cjs && node --check public/app.js && node --check ops/opuscraft-host.cjs && node --check ops/patch-opuscraft.mjs
      - run: node --test --test-concurrency=1 tests/pong-physics.cjs tests/snake.cjs tests/game-covers.cjs tests/opuscraft-migration.cjs tests/opuscraft-production-cache.cjs tests/opuscraft-worlds-teleport.cjs tests/opuscraft-backup-api.cjs tests/legacy-minecraft-retirement.cjs tests/opuscraft-npc.cjs
      - name: Build pinned OpusCraft
        run: bash ops/build-opuscraft.sh
      - name: Validate compiled web assets
        run: |
          test -s public/opuscraft/index.html
          test -s ops/opuscraft-relay.mjs
          grep -q '/opuscraft/assets/' public/opuscraft/index.html
      - name: Smoke test persistent headless multiplayer host
        shell: bash
        run: |
          set -euo pipefail
          OPUSCRAFT_CI_MARKER=yes node ops/opuscraft-host.cjs >/tmp/opuscraft-host.log 2>&1 &
          HOST_PID=$!
          trap 'kill "$HOST_PID" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 95); do
            if curl -fsS --max-time 2 http://127.0.0.1:4173/__health 2>/dev/null | grep -q '"ready":true' &&
               curl -fsS --max-time 2 http://127.0.0.1:4173/__health 2>/dev/null | grep -q '"lastSave":"20'; then
              ready=1
              break
            fi
            sleep 2
          done
          if test "$ready" -ne 1; then
            cat /tmp/opuscraft-host.log
            exit 1
          fi
          echo "Verified VPS-compatible WebGL2 game host, relay, and world save"
          curl -fsS http://127.0.0.1:4173/__health
          if ! node ops/opuscraft-guest-smoke.cjs; then
            echo "::error::Two-player smoke failed: permanent world host logs follow"
            tail -n 170 /tmp/opuscraft-host.log
            exit 1
          fi
          # Test recovery using the SAME Chromium profile, never a newly generated world.
          # Save a physical world block at a known world coordinate, then
          # verify that same block AFTER the Chromium server was terminated.
          placed="$(curl -fsS --max-time 12 'http://127.0.0.1:4173/__ci/world-block?mode=write')"
          echo "OPUSCRAFT_WORLD_BLOCK_WRITTEN $placed"
          block_expect="$(printf '%s' "$placed" | node -e 'let x="";process.stdin.on("data",b=>x+=b).on("end",()=>{const j=JSON.parse(x);if(!j.ok||j.state!==j.actual||!j.state)process.exit(1);process.stdout.write(j.x+"|"+j.z+"|"+j.state)})')"
          original_id="$(curl -fsS http://127.0.0.1:4173/__debug | node -e '
            let s="";process.stdin.on("data",b=>s+=b).on("end",()=>{
              const j=JSON.parse(s);
              if(!j.world?.id || !j.world?.created)process.exit(2);
              process.stdout.write(j.world.id+"|"+j.world.created)
            })
          ')"
          echo "OPUSCRAFT_WORLD_BEFORE_RESTART $original_id"
          kill -TERM "$HOST_PID"
          wait "$HOST_PID" || true
          OPUSCRAFT_CI_MARKER=yes node ops/opuscraft-host.cjs >/tmp/opuscraft-restarted.log 2>&1 &
          HOST_PID=$!
          recovered=0
          for attempt in $(seq 1 95); do
            if curl -fsS --max-time 3 http://127.0.0.1:4173/__health 2>/dev/null | grep -q '"ready":true' &&
               curl -fsS --max-time 3 http://127.0.0.1:4173/__health 2>/dev/null | grep -q '"lastSave":"20'; then
              recovered=1
              break
            fi
            sleep 2
          done
          if test "$recovered" -ne 1; then
            echo "OpusCraft did not restore after restart"
            cat /tmp/opuscraft-restarted.log
            exit 1
          fi
          restored_id="$(curl -fsS http://127.0.0.1:4173/__debug | node -e '
            let s="";process.stdin.on("data",b=>s+=b).on("end",()=>{
              const j=JSON.parse(s);process.stdout.write((j.world?.id||"")+"|"+(j.world?.created||""))
            })
          ')"
          test "$original_id" = "$restored_id" || {
            echo "World changed after process restart: before=$original_id after=$restored_id"
            cat /tmp/opuscraft-restarted.log
            exit 1
          }
          marker_x="$(echo "$block_expect" | cut -d'|' -f1)"
          marker_z="$(echo "$block_expect" | cut -d'|' -f2)"
          marker_state="$(echo "$block_expect" | cut -d'|' -f3)"
          loaded="$(curl -fsS --max-time 10 "http://127.0.0.1:4173/__ci/world-block?mode=read&x=$marker_x&z=$marker_z")"
          actual_state="$(printf '%s' "$loaded" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).state")"
          test "$actual_state" = "$marker_state" || { echo "Persistent chunk lost: before=$marker_state after=$actual_state"; exit 1; }
          echo "OPUSCRAFT_WORLD_BLOCK_SURVIVED_RESTART_OK at $marker_x,315,$marker_z state=$actual_state"
          echo "OPUSCRAFT_WORLD_PERSISTENCE_AFTER_RESTART_OK $restored_id"


  deploy:
    needs: validate
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.ENABLE_DEPLOY == 'true' && vars.APP_READY == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Configurar SSH e verificar identidade
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          FP: ${{ secrets.VPS_HOST_FINGERPRINT }}
          HOST: ${{ secrets.VPS_HOST }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null
          actual="$(ssh-keygen -lf ~/.ssh/known_hosts -E sha256 | awk 'NR==1 {print $2}')"
          test "$actual" = "$FP"
          ssh-keygen -F "$HOST" -f ~/.ssh/known_hosts >/dev/null
      - name: Diagnosticar TCP SSH da VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -eu
          echo "Testando acesso TCP externo à VPS..."
          if timeout 18 bash -c 'echo > /dev/tcp/"$1"/"$2"' _ "$VPS_HOST" "$VPS_PORT"; then
            echo "TCP_PORT_OPEN"
          else
            echo "::error::TCP_PORT_UNREACHABLE: runner não alcança SSH da VPS"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Build pinned OpusCraft for production
        run: bash ops/build-opuscraft.sh
      - name: Package OpusCraft-only application
        run: tar -czf release.tar.gz server.cjs package.json public database ops
      - name: Upload release to the VPS
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT }}
        run: scp -B -P "$PORT" -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes release.tar.gz "$USER@$HOST:/home/gamesforchildren/apps/games-for-children/release.tar.gz"
      - name: Activate and validate permanent VPS world or rollback
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT }}
        run: ssh -p "$PORT" -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes "$USER@$HOST" 'bash -s' < ops/deploy-opuscraft-vps.sh
