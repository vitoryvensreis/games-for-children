name: GamesNavagador | Validação e deploy
# Each run reflects the PR milestone and commit instead of repeating the WIP title.
run-name: "${{ github.event_name == 'pull_request' && format('PR #{0}: {1} [{2}]', github.event.pull_request.number, github.event.pull_request.title, github.event.pull_request.head.sha) || github.event.head_commit.message || 'Execução manual GamesNavagador' }}"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-gamesforchildren
  cancel-in-progress: false

jobs:
  validate:
    name: "Validação essencial: jogos, engine Node e cliente"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: node --check server.cjs && node --check public/app.js && node --check ops/opuscraft-headless/run-dedicated.cjs
      - run: node --test --test-concurrency=1 tests/pong-physics.cjs tests/snake.cjs tests/game-covers.cjs
      - name: Build upstream OpusCraft + integration of original Node engine
        run: bash ops/build-opuscraft.sh
      - name: First playable dedicated browser (single end-to-end check)
        run: node ops/opuscraft-dedicated-browser-smoke.cjs
      - name: Verify vanilla client and relay assets
        run: |
          test -s public/opuscraft/index.html
          test -s public/opuscraft/UPSTREAM-COMMIT.txt
          test -s ops/opuscraft-relay.mjs
          grep -q '/opuscraft/assets/' public/opuscraft/index.html


  deploy:
    name: "Publicar produção (somente main autorizado)"
    needs: validate
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.ENABLE_DEPLOY == 'true' && vars.APP_READY == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Configurar SSH e verificar identidade
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          FP: ${{ secrets.VPS_HOST_FINGERPRINT }}
          HOST: ${{ secrets.VPS_HOST }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null
          actual="$(ssh-keygen -lf ~/.ssh/known_hosts -E sha256 | awk 'NR==1 {print $2}')"
          test "$actual" = "$FP"
          ssh-keygen -F "$HOST" -f ~/.ssh/known_hosts >/dev/null
      - name: Diagnosticar TCP SSH da VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -eu
          echo "Testando acesso TCP externo à VPS..."
          if timeout 18 bash -c 'echo > /dev/tcp/"$1"/"$2"' _ "$VPS_HOST" "$VPS_PORT"; then
            echo "TCP_PORT_OPEN"
          else
            echo "::error::TCP_PORT_UNREACHABLE: runner não alcança SSH da VPS"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Build pinned OpusCraft for production
        run: bash ops/build-opuscraft.sh
      - name: Package OpusCraft-only application
        run: tar -czf release.tar.gz server.cjs package.json public database ops
      - name: Upload release to the VPS
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT }}
        run: scp -B -P "$PORT" -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes release.tar.gz "$USER@$HOST:/home/gamesforchildren/apps/games-for-children/release.tar.gz"
      - name: Activate and validate permanent VPS world or rollback
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT }}
        run: ssh -p "$PORT" -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes "$USER@$HOST" 'bash -s' < ops/deploy-opuscraft-vps.sh
