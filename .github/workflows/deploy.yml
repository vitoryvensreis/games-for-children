name: Deploy GamesForChildren
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-gamesforchildren
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: node --check server.cjs && node --check public/app.js && node --check database/migrate.cjs && node --check public/snake-rules.js
      - run: node --test tests/integration.cjs tests/snake.cjs tests/catalog-layout.cjs

  deploy:
    needs: validate
    if: ${{ vars.ENABLE_DEPLOY == 'true' && vars.APP_READY == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Configurar SSH e verificar identidade
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          FP: ${{ secrets.VPS_HOST_FINGERPRINT }}
          HOST: ${{ secrets.VPS_HOST }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null
          actual="$(ssh-keygen -lf ~/.ssh/known_hosts -E sha256 | awk 'NR==1 {print $2}')"
          test "$actual" = "$FP"
          ssh-keygen -F "$HOST" -f ~/.ssh/known_hosts >/dev/null
      - name: Diagnosticar TCP SSH da VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -eu
          echo "Testando acesso TCP externo à VPS..."
          if timeout 18 bash -c 'echo > /dev/tcp/"$1"/"$2"' _ "$VPS_HOST" "$VPS_PORT"; then
            echo "TCP_PORT_OPEN"
          else
            echo "::error::TCP_PORT_UNREACHABLE: runner não alcança SSH da VPS"
            exit 1
          fi
      - name: Restaurar compilação ClassiCube em cache
        uses: actions/cache@v4
        with:
          path: |
            public/classicube/ClassiCube.js
            public/classicube/ClassiCube.wasm
            public/classicube/default.zip
          key: classicube-web-1.3.8-ubuntu-emscripten-v1
      - name: Compilar ClassiCube oficial para web, quando necessário
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/classicube
          if test -s public/classicube/ClassiCube.js && test -s public/classicube/ClassiCube.wasm && test -s public/classicube/default.zip; then
            echo "ClassiCube oficial recuperado do cache seguro."
          else
            echo "Compilando fontes oficiais ClassiCube, versão 1.3.8, no runner de CI."
            sudo apt-get update -qq
            sudo apt-get install -y -qq emscripten
            git clone --depth 1 --branch 1.3.8 https://github.com/ClassiCube/ClassiCube.git /tmp/classicube-official
            cd /tmp/classicube-official
            git rev-parse HEAD
            make web RELEASE=1
            test -s ClassiCube.js
            test -s ClassiCube.wasm
            cp ClassiCube.js ClassiCube.wasm "$GITHUB_WORKSPACE/public/classicube/"
            curl --fail --location --silent --show-error --retry 2 --max-time 60 --proto '=https' --proto-redir '=https' \
              "https://raw.githubusercontent.com/ClassiCube/ClassiCube/master/misc/cc_textures.zip" \
              -o "$GITHUB_WORKSPACE/public/classicube/default.zip"
            cd "$GITHUB_WORKSPACE"
          fi
          test "$(wc -c < public/classicube/ClassiCube.js)" -gt 50000
          test "$(wc -c < public/classicube/ClassiCube.wasm)" -gt 200000
          test "$(wc -c < public/classicube/default.zip)" -gt 10000
          head -c 4 public/classicube/ClassiCube.wasm | od -An -tx1 | tr -d ' ' | grep -q '^0061736d'
          sha256sum public/classicube/ClassiCube.js public/classicube/ClassiCube.wasm public/classicube/default.zip
      - name: Empacotar aplicação
        run: tar -czf release.tar.gz server.cjs package.json public database
      - name: Enviar servidor
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT }}
        run: |
          scp -B -P "$PORT" -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes release.tar.gz "$USER@$HOST:/home/gamesforchildren/apps/games-for-children/release.tar.gz"
      - name: Ativar e validar nova versão
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh -p "$PORT" -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes "$USER@$HOST" 'set -eu
            cd /home/gamesforchildren/apps/games-for-children
            mkdir -p backup
            cp server.cjs backup/server.cjs
            if test -d public; then cp -a public backup/public; fi
            if test -f package.json; then cp package.json backup/package.json; fi
            tar -xzf release.tar.gz
            PATH=/home/gamesforchildren/.nvm/versions/node/v24.21.0/bin:$PATH /home/gamesforchildren/.nvm/versions/node/v24.21.0/bin/npm install --omit=dev --no-audit --no-fund
            if sudo -n /usr/bin/systemctl restart games-for-children.service; then
              for i in 1 2 3 4 5; do
                if curl --fail --silent --max-time 3 http://127.0.0.1:3100/api/health | grep -q ok \
                    && curl --fail --silent --output /dev/null --max-time 3 http://127.0.0.1:3100/classicube/ClassiCube.js \
                    && curl --fail --silent --output /dev/null --max-time 3 http://127.0.0.1:3100/classicube/ClassiCube.wasm \
                    && curl --fail --silent --output /dev/null --max-time 3 http://127.0.0.1:3100/static/default.zip; then
                  echo DEPLOY_HEALTH_OK_CLASSICUBE_ASSETS_OK
                  exit 0
                fi
                sleep 2
              done
            fi
            echo DEPLOY_FAILED_ROLLBACK
            cp backup/server.cjs server.cjs
            if test -d backup/public; then rm -rf public; cp -a backup/public public; fi
            if test -f backup/package.json; then cp backup/package.json package.json; fi
            sudo -n /usr/bin/systemctl restart games-for-children.service
            exit 1'
